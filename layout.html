
<!DOCTYPE html>
<html>
<head>
    <title>My Layout</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            background: black;
            color: white;
            padding: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background: lightblue;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>My Dashboard</h1>

    <div class="navbar">
        <span>Home</span>
        <span>About</span>
        <span>Contact</span>
    </div>

    <div class="container">
        <div class="card">Home</div>
        <div class="card">Profile</div>
        <div class="card">Settings</div>
    </div>

</body>
</html>
